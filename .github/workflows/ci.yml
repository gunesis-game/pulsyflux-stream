name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "These Go files need gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Run race tests (Linux)
        if: runner.os == 'Linux'
        run: go test -race -cover ./...
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: go test -cover ./...
      - name: Run vet
        run: go vet ./...
      - name: Build package
        run: go build ./...
